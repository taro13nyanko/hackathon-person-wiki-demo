services:
  - type: web
    name: people-wiki-fast-forward-api
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_URL
        value: https://api.openai.com/v1/responses
      - key: ALLOWED_ORIGINS
        value: https://taro13nyanko.github.io
      - key: RATE_LIMIT_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PYTHON_VERSION
        value: 3.13.5
